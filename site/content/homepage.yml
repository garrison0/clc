announcements:
  - title: Ordinary TIme
    description: 'We are now in the Church Liturgical Season of "Ordinary Time" or
      "The Sundays after Pentecost." In this season of the Church year, the
      color green predominates. We are reminded by the color green of growth. We
      remember in this season as we focus on the ministry of Jesus, God is
      growing and maturing His Church through the Gospel and the Holy Spirit. '
    datetime: 2026-07-01T09:22:00.000-04:00
  - title: Free English classes are Back! Join us at 2:00pm on Sundays!
    datetime: 2026-07-01T09:27:00.000-04:00
    description: "English classes are back in session!  "
  - title: 12 week Bible study on Revelation (on zoom) starts OCT 1st.
    description: Starting on Thursday October 1st, Pastor Alex will be leading a 12
      week bible study series on the first half of the book of Revelation (We
      will finish the book in the Spring!). Join us on Zoom on Thursdays at 7pm
      as we study this powerful but often confusing and settling book of the
      bible together!
    datetime: 2026-09-23T08:57:00.000-04:00
  - title: 130th Anniversary service Sunday October 4th
    description: Join us on October 4th at 3pm for a very special service
      celebrating 130 years of Christ centered ministry at Christ Church! Jesus
      has been the author and perfecter of our faith at Christ Church for the
      past 130 and Jesus will continue to lead His people at Christ Church into
      the future! Come celebrate with us in Worship, October 4th at 3pm. (Please
      note that there will be no morning 10am Sunday School or 11am worship
      service that day)
    datetime: 2026-09-23T09:02:00.000-04:00
