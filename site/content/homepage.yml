  - title: Ordinary TIme
    description: 'We are now in the Church Liturgical Season of "Ordinary Time" or
      "The Sundays after Pentecost." In this season of the Church year, the
      color green predominates. We are reminded by the color green of growth. We
      remember in this season as we focus on the ministry of Jesus, God is
      growing and maturing His Church through the Gospel and the Holy Spirit. '
